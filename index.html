<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ij games</title>
<meta name="description" content="ij games makes small, minimalist mobile games. Play Morf, a physics puzzle where you reshape a ball to reach the flag.">
<link rel="icon" href="img/morf-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040707;
    --panel: #1f2b3a;
    --text: #f6f4f5;
    --muted: #9aa6b2;
    --pink: #ec4083;
    --blue: #4aa3dc;
    --red: #f04a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 Nunito, system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 32px; }
  header { text-align: center; padding: 24px 0 56px; }
  header img { width: min(320px, 70vw); height: auto; }
  header p { color: var(--muted); margin: 16px 0 0; }
  h1, h2 { font-family: Fredoka, Nunito, sans-serif; font-weight: 600; line-height: 1.2; }
  .game {
    background: var(--panel);
    border-radius: 20px;
    padding: 28px;
  }
  .game-head { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
  .game-head img { width: 84px; height: 84px; border-radius: 18px; flex: none; }
  .game-head h2 { margin: 0; font-size: 2rem; }
  .game-head p { margin: 2px 0 0; color: var(--muted); }
  .video {
    position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    background: #000; margin: 0 0 20px;
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    display: inline-block; background: var(--red); color: #fff; text-decoration: none;
    font-family: Fredoka, Nunito, sans-serif; font-weight: 500; font-size: 1.1rem;
    padding: 12px 24px; border-radius: 999px; margin-top: 8px;
  }
  .play:hover, .play:focus-visible { filter: brightness(1.1); }
  .play:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  footer { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 40px 0 8px; }
  footer a { color: var(--muted); }
  @media (max-width: 480px) {
    .game { padding: 20px; }
    .game-head img { width: 64px; height: 64px; }
    .game-head h2 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="img/ij-games-logo.png" alt="ij games" width="868" height="290">
    <p>Small, minimalist mobile games.</p>
  </header>

  <section class="game" aria-labelledby="morf">
    <div class="game-head">
      <img src="img/morf-icon.png" alt="" width="84" height="84">
      <div>
        <h2 id="morf">Morf</h2>
        <p>A physics puzzle about a ball that changes shape.</p>
      </div>
    </div>
    <div class="video">
      <iframe src="https://www.youtube-nocookie.com/embed/Sh4uOPcwGLs" title="Morf trailer" loading="lazy"
        allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <p>Swipe up and Morf grows bigger and heavier. Swipe down and it shrinks and gets bouncier. Use that to roll, push, and bounce your way to the flag.</p>
    <a class="play" href="https://play.google.com/store/apps/details?id=com.ijgames.morf">Get it on Google Play</a>
  </section>

  <footer>
    <p>© ij games</p>
  </footer>
</main>
</body>
</html>
